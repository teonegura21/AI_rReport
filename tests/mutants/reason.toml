# Mutants of rr_reason: the reducers' and the tiers' rules: each removes one rule, and names the test
# that must fail without it. Run: scripts/mutate.py tests/mutants/reason.toml
# What they found is in docs/design/reasoning.md, "How the tests were validated".

target = "rr_reason_tests"
binary = "build/dev/tests/unit/reason/rr_reason_tests"
timeout = 60

[[mutant]]
name = "quorum-without-slack"
file = "src/reason/vote.cpp"
expect = "Vote.AQuorumIsAShareOfTheVotesCast"
  [[mutant.edit]]
  from = '''return static_cast<double>(votes) + kSlack >= quorum'''
  to = '''return static_cast<double>(votes) + (0 * kSlack) >= quorum'''

[[mutant]]
name = "tie-settled"
file = "src/reason/vote.cpp"
expect = "Vote.ATieIsNeverSettled"
  [[mutant.edit]]
  from = '''return top > runner_up(counts) && reaches(top, cast, quorum);'''
  to = '''return top >= runner_up(counts) && reaches(top, cast, quorum);'''

