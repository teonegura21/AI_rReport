# Mutants of rr_eval: each removes one rule of reading the eval's files,
# keeping a snapshot, anchoring gold to the timeline, drafting silver, or
# making the review sheet, and names the test that must fail without it.
# Run: scripts/mutate.py tests/mutants/eval.toml
# What they found is in docs/design/eval.md, "How the tests were validated".

target = "rr_eval_tests"
binary = "build/dev/tests/unit/eval/rr_eval_tests"
timeout = 120

# --- Files read strictly (toml_io.hpp, set.cpp) -----------------------------------

