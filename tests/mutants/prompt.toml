# Mutants of rr_prompt: the prompt library's rules: each removes one rule, and names the test
# that must fail without it. Run: scripts/mutate.py tests/mutants/prompt.toml
# What they found is in docs/design/prompts.md, "How the tests were validated".

target = "rr_prompt_tests"
binary = "build/dev/tests/unit/prompt/rr_prompt_tests"
timeout = 120

[[mutant]]
name = "data-not-collected"
file = "src/prompt/library.cpp"
expect = "PromptLibrary.TheSystemPartMayUseOnlySharedVariables"
  [[mutant.edit]]
  from = '''used_.insert(node.name.substr(0, node.name.find('.')));'''
  to = '''(void)node.name;'''

[[mutant]]
name = "loop-source-not-read"
file = "src/prompt/library.cpp"
expect = "PromptLibrary.TheSystemPartMayUseOnlySharedVariables"
  [[mutant.edit]]
  from = '''        local_.insert("loop");
        node.condition.accept(*this);
        node.body.accept(*this);
    }
    void visit(const inja::ForObjectStatementNode'''
  to = '''        local_.insert("loop");
        node.body.accept(*this);
    }
    void visit(const inja::ForObjectStatementNode'''

[[mutant]]
name = "if-branch-not-read"
file = "src/prompt/library.cpp"
expect = "PromptLibrary.TheSystemPartMayUseOnlySharedVariables"
  [[mutant.edit]]
  from = '''        node.true_statement.accept(*this);
'''
  to = ''''''

