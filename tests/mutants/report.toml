# Mutants of rr_report (P21): the page of a job, each a rule of it removed,
# and the test that must fail without it.
# Run: scripts/mutate.py tests/mutants/report.toml

target = "rr_report_tests"
binary = "build/dev/tests/unit/report/rr_report_tests"
timeout = 120

[[mutant]]
name = "an-ampersand-is-html"
file = "src/report/page.cpp"
expect = "Escaped.EscapesWhatHtmlReads"
  [[mutant.edit]]
  from = '''                out += "&amp;";'''
  to = '''                out += "&";'''

[[mutant]]
name = "a-tag-is-html"
file = "src/report/page.cpp"
expect = "Page.NothingFromTheVideoIsTakenAsHtml"
  [[mutant.edit]]
  from = '''                out += "&lt;";'''
  to = '''                out += "<";'''

[[mutant]]
name = "a-tag-closes"
file = "src/report/page.cpp"
expect = "Escaped.EscapesWhatHtmlReads"
  [[mutant.edit]]
  from = '''                out += "&gt;";'''
  to = '''                out += ">";'''

[[mutant]]
name = "a-double-quote-ends-an-attribute"
file = "src/report/page.cpp"
expect = "Escaped.EscapesWhatHtmlReads"
  [[mutant.edit]]
  from = '''                out += "&quot;";'''
  to = '''                out += "\"";'''

[[mutant]]
name = "a-single-quote-ends-an-attribute"
file = "src/report/page.cpp"
expect = "Escaped.EscapesWhatHtmlReads"
  [[mutant.edit]]
  from = '''                out += "&#39;";'''
  to = '''                out += "'";'''

[[mutant]]
name = "an-id-of-any-length-links"
file = "src/report/page.cpp"
expect = "Page.OnlyAnIdOfYouTubesFormMakesAVideoLink"
  [[mutant.edit]]
  from = '''    return id.size() == 11 && std::ranges::all_of(id, allowed);'''
  to = '''    return id.size() >= 10 && std::ranges::all_of(id, allowed);'''

[[mutant]]
name = "an-id-of-any-characters-links"
file = "src/report/page.cpp"
expect = "Page.OnlyAnIdOfYouTubesFormMakesAVideoLink"
  [[mutant.edit]]
  from = '''    return id.size() == 11 && std::ranges::all_of(id, allowed);'''
  to = '''    return id.size() == 11 && (std::ranges::all_of(id, allowed) || true);'''

[[mutant]]
name = "a-caption-files-moments-link-nowhere"
file = "src/report/page.cpp"
expect = "Page.ACaptionFilesMomentsLinkToItsTranscript"
  [[mutant.edit]]
  from = '''        return std::format("#{}", sentence);'''
  to = '''        return std::format("#{}", sentence).substr(0, 1);'''

[[mutant]]
name = "a-sentence-starts-at-its-last-atom"
file = "src/report/page.cpp"
expect = "Page.ASentenceOfSeveralAtomsStartsAtItsFirst"
  [[mutant.edit]]
  from = '''    const std::optional<Millis> at = timeline.said(sentence.markers.front().atom);'''
  to = '''    const std::optional<Millis> at = timeline.said(sentence.markers.back().atom);'''

[[mutant]]
name = "every-heading-starts-the-video"
file = "src/report/page.cpp"
expect = "Page.EachSectionIsHeadedWithItsStartAndListedInTheContents"
  [[mutant.edit]]
  from = '''time_link(timeline, starts[section - 1])'''
  to = '''time_link(timeline, starts[0])'''

[[mutant]]
name = "a-share-is-turned-over"
file = "src/report/page.cpp"
expect = "Page.WhatWasKeptIsCountedOnTheArticleAsItIs"
  [[mutant.edit]]
  from = '''    return std::format("{:.1f}%", 100.0 * static_cast<double>(part) / static_cast<double>(whole));'''
  to = '''    return std::format("{:.1f}%", 100.0 * static_cast<double>(part + 1) / static_cast<double>(whole + 1));'''

