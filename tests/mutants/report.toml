  to = '''        if ((more != usual || !usual.empty()) && more != knowledge::to_string(atom.kind)) {'''

[[mutant]]
name = "a-heading-keeps-its-hashes"
file = "src/report/page.cpp"
expect = "Page.EachSectionIsHeadedWithItsStartAndListedInTheContents"
