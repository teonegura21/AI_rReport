expect = "Page.WhatTheStagesCouldNotDoIsShown"
  [[mutant.edit]]
  from = '''        if (stage.findings.empty()) {'''
  to = '''        if (false) {'''

[[mutant]]
name = "the-usual-labels-are-said"
