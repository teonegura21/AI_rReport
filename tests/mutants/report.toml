[[mutant]]
name = "an-untitled-video-has-no-title"
file = "src/report/page.cpp"
expect = "Page.AJobBeforeItsSourceIsAPageToo"
  [[mutant.edit]]
  from = '''                                  : std::string{"A video without a title"};'''
