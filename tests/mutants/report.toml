# What a page shows, read back from the library (src/report/contents.cpp).

[[mutant]]
name = "an-annotation-is-a-page"
file = "src/report/contents.cpp"
expect = "ContentsTest.AnEvalAnnotationHasNoArticleToShow"
  [[mutant.edit]]
  from = '''    if (job.kind != library::JobKind::article) {'''
  to = '''    if (false) {'''

[[mutant]]
name = "a-failed-stage-is-listed"
file = "src/report/contents.cpp"
expect = "ContentsTest.AFailedRunMadeNothingEvenWhereAnEarlierRunHadDoneIt"
  [[mutant.edit]]
  from = '''            continue;  // it failed: it made nothing'''
  to = '''            contents.findings.push_back(StageFindings{.stage = run.stage});
            continue;'''

[[mutant]]
name = "findings-are-not-shown"
file = "src/report/contents.cpp"
expect = "ContentsTest.AJobDoneShowsEachStagesArtifactAndWhatItCouldNotDo"
  [[mutant.edit]]
  from = '''        contents.findings.push_back(StageFindings{.stage = run.stage, .findings = run.findings});'''
  to = '''        contents.findings.push_back(StageFindings{.stage = run.stage});'''

[[mutant]]
name = "the-write-article-wins"
file = "src/report/contents.cpp"
expect = "ContentsTest.TheArticleIsTheSeamsStagesWhereItRanElseTheWriteStages"
  [[mutant.edit]]
  from = '''    if (!contents.article.has_value()) {'''
  to = '''    if (written.has_value()) {'''

[[mutant]]
name = "the-seams-article-is-not-read"
file = "src/report/contents.cpp"
expect = "ContentsTest.TheArticleIsTheSeamsStagesWhereItRanElseTheWriteStages"
  [[mutant.edit]]
  from = '''    } else if (stage == pipeline::SeamsStage::kName) {'''
  to = '''    } else if (stage == "seam") {'''

[[mutant]]
name = "the-write-article-is-not-read"
file = "src/report/contents.cpp"
expect = "ContentsTest.TheArticleIsTheSeamsStagesWhereItRanElseTheWriteStages"
  [[mutant.edit]]
  from = '''    } else if (stage == pipeline::WriteStage::kName) {'''
  to = '''    } else if (stage == "writing") {'''
