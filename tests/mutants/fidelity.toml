# Mutants of rr_fidelity: each removes one rule of the ledger checks and names the test
# that must fail without it. Run: scripts/mutate.py tests/mutants/fidelity.toml
# What they found is in docs/design/fidelity.md, "How the tests were validated".

target = "rr_fidelity_tests"
binary = "build/dev/tests/unit/fidelity/rr_fidelity_tests"
timeout = 60

[[mutant]]
name = "both-atoms-and-filler-pass"
file = "src/fidelity/ledger.cpp"
expect = "Ledger.ASentenceIsAtomsOrFillerNotBoth"
  [[mutant.edit]]
  from = '''if (atoms != told.end() && filler != fillers.end()) {'''
  to = '''if (false && atoms != told.end() && filler != fillers.end()) {'''

