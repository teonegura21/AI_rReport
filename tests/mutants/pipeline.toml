# Mutants of rr_pipeline, and of the stage store it commits to: each removes
# one rule of running a job's stages, keying their results, reading a source,
# or punctuating captions, and names the test that must fail without it.
# Run: scripts/mutate.py tests/mutants/pipeline.toml
# What they found is in docs/design/pipeline.md, "How the tests were validated".

target = "rr_pipeline_tests"
binary = "build/dev/tests/unit/pipeline/rr_pipeline_tests"
timeout = 120

