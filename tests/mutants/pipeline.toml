[[mutant]]
name = "fusion-is-never-asked"
file = "src/pipeline/write_stage.cpp"
expect = "WriteStageTest.AFusingTierHasTheCommanderWriteOneDraftMoreFromThoseThatPass"
  [[mutant.edit]]
  from = '''        if (compute_.fuse) {'''
  to = '''        if (compute_.fuse && false) {'''

[[mutant]]
