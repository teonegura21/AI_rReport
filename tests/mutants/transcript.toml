# Mutants of rr_transcript: each removes one rule of reading captions,
# projecting punctuation or cutting sentences, and names the test that must
# fail without it. Run: scripts/mutate.py tests/mutants/transcript.toml
# What they found is in docs/design/transcript.md, "How the tests were validated".

target = "rr_transcript_tests"
binary = "build/dev/tests/unit/transcript/rr_transcript_tests"
timeout = 60

# --- What every format shares (cues.cpp) ---------------------------------------

[[mutant]]
name = "numeric-references-unread"
file = "src/transcript/cues.cpp"
expect = "Captions.CharacterReferencesAreDecoded"
  [[mutant.edit]]
  from = '''    return value == 0 ? std::nullopt : std::optional<char32_t>{value};'''
  to = '''    return value == 1234567 ? std::optional<char32_t>{value} : std::nullopt;'''

