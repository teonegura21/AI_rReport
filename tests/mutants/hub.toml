expect = "HubConfig.AJobsCeilingsAreTheUsersAndNeverNothing"
  [[mutant.edit]]
  from = '''    if (limits.tokens_per_hour <= 0) {'''
  to = '''    if (limits.tokens_per_hour < 0) {'''

[[mutant]]
name = "a-ceiling-of-no-time-is-taken"
file = "src/hub/hub_config.cpp"
expect = "HubConfig.AJobsCeilingsAreTheUsersAndNeverNothing"
  [[mutant.edit]]
  from = '''    if (limits.time_per_hour.count() <= 0) {'''
  to = '''    if (limits.time_per_hour.count() < 0) {'''

[[mutant]]
name = "a-video-may-count-as-nothing"
file = "src/hub/hub_config.cpp"
expect = "HubConfig.AJobsCeilingsAreTheUsersAndNeverNothing"
  [[mutant.edit]]
  from = '''    if (limits.least_video.count() <= 0) {'''
  to = '''    if (limits.least_video.count() < 0) {'''
