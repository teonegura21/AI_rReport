# Mutants of rr_agents: the army's rules: each removes one rule, and names the test
# that must fail without it. Run: scripts/mutate.py tests/mutants/agents.toml
# What they found is in docs/design/agents.md, "How the tests were validated".

target = "rr_agents_tests"
binary = "build/dev/tests/unit/agents/rr_agents_tests"
timeout = 150

[[mutant]]
name = "answers-share-one-slot"
file = "src/agents/army.cpp"
expect = "Army.EachAnswerTakesASlot"
  [[mutant.edit]]
  from = '''battalion.slots().acquire(stop, priority, Slots{static_cast<std::size_t>(choices)})'''
  to = '''battalion.slots().acquire(stop, priority, Slots{1})'''

