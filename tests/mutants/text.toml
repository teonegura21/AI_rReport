# Mutants of rr_text: each removes one rule of text handling and names the test that
# must fail without it. Run: scripts/mutate.py tests/mutants/text.toml
# What they found is in docs/design/text.md, "How the tests were validated".

target = "rr_text_tests"
binary = "build/dev/tests/unit/text/rr_text_tests"
timeout = 60

[[mutant]]
name = "fold-keeps-case"
file = "src/text/unicode.cpp"
expect = "Unicode.FoldMakesTheWaysOfWritingOneTextEqual"
  [[mutant.edit]]
  from = '''UTF8PROC_CASEFOLD | UTF8PROC_STRIPMARK));'''
  to = '''UTF8PROC_STRIPMARK));'''

