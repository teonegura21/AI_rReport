# Mutants of the oracle and its fault injectors: each removes one rule, and names the test
# that must fail without it. Run: scripts/mutate.py tests/mutants/oracle.toml
# What they found is in docs/design/testing.md, "How the tests were validated".

target = "rr_oracle_tests"
binary = "build/dev/tests/unit/oracle/rr_oracle_tests"
timeout = 60

[[mutant]]
name = "oracle-guesses"
file = "tests/oracle/oracle.cpp"
expect = "Oracle.AnswersTheKindsItWasTaught"
  [[mutant.edit]]
  from = '''    if (answerer == answerers_.end()) {
        return fail(Errc::unsupported,'''
  to = '''    if (answerer == answerers_.end()) {
        return llm::ChatResponse{};
        return fail(Errc::unsupported,'''

[[mutant]]
name = "oracle-one-choice"
file = "tests/oracle/oracle.cpp"
expect = "Oracle.AnswersTheKindsItWasTaught"
  [[mutant.edit]]
  from = '''    for (int choice = 0; choice < request.n.value_or(1); ++choice) {'''
  to = '''    for (int choice = 0; choice < 1; ++choice) {'''

[[mutant]]
name = "oracle-ignores-stop"
file = "tests/oracle/oracle.cpp"
expect = "Oracle.AnswersTheKindsItWasTaught"
  [[mutant.edit]]
  from = '''    if (stop.stop_requested()) {
        return fail(Errc::cancelled, "the oracle was stopped");'''
  to = '''    if (stop.stop_requested() && false) {
        return fail(Errc::cancelled, "the oracle was stopped");'''

[[mutant]]
name = "tokens-round-down"
