# Mutants of rr_library's jobs: each removes one rule of keeping what a job
# makes, and names the test that must fail without it. (The stage store's
# rules are in pipeline.toml, whose tests commit through it.)
# Run: scripts/mutate.py tests/mutants/library.toml
# What they found is in docs/design/eval.md, "How the tests were validated".

target = "rr_library_tests"
binary = "build/dev/tests/unit/library/rr_library_tests"
timeout = 60

[[mutant]]
name = "a-job-is-read-as-an-article"
file = "src/library/jobs.cpp"
expect = "JobsTest.AJobSaysWhatItMakes"
  [[mutant.edit]]
  from = '''               .kind = *made};'''
  to = '''               .kind = made.has_value() ? JobKind::article : JobKind::annotation};'''

[[mutant]]
name = "a-job-is-written-as-an-article"
file = "src/library/jobs.cpp"
expect = "JobsTest.AJobSaysWhatItMakes"
  [[mutant.edit]]
  from = '''             to_string(job.kind)}));'''
  to = '''             to_string(JobKind::article)}));'''

[[mutant]]
name = "a-kind-is-named-by-another"
file = "src/library/jobs.cpp"
expect = "JobKind.NamesItsKinds"
  [[mutant.edit]]
  from = '''    {JobKind::annotation, "annotation"},'''
  to = '''    {JobKind::annotation, "article"},'''

# --- Migration 0007: jobs made anew, the judgement kind (P24) ----------------------

[[mutant]]
name = "migration-7-forgets-the-judgement-kind"
file = "migrations/0007_judgement.sql"
expect = "JobsTest.AJobSaysWhatItMakes"
  [[mutant.edit]]
  from = '''                  CHECK (kind IN ('article', 'annotation', 'judgement'))'''
  to = '''                  CHECK (kind IN ('article', 'annotation'))'''

[[mutant]]
name = "migration-7-loses-a-column"
file = "migrations/0007_judgement.sql"
expect = "Library.JobsMadeAnewByMigration7KeepEveryJobAndWhatRefersToThem"
  [[mutant.edit]]
  from = '''SELECT id, source, tier, salt, status, error, title, elapsed_ms, created_at_ms, updated_at_ms, kind'''
  to = '''SELECT id, source, tier, salt, status, NULL, title, elapsed_ms, created_at_ms, updated_at_ms, kind'''

[[mutant]]
name = "the-judgement-kind-has-no-name"
file = "src/library/jobs.cpp"
expect = "JobKind.NamesItsKinds"
  [[mutant.edit]]
  from = '''    {JobKind::judgement, "judgement"},'''
  to = ''''''

[[mutant]]
name = "migration-8-checks-no-replicate"
file = "migrations/0008_first_replicate.sql"
expect = "Library.Migration8StartsEveryRunMadeBeforeAtReplicateZero"
  [[mutant.edit]]
  from = '''DEFAULT 0 CHECK (first_replicate >= 0);'''
  to = '''DEFAULT 0;'''

[[mutant]]
name = "migration-8-starts-runs-at-one"
file = "migrations/0008_first_replicate.sql"
expect = "Library.Migration8StartsEveryRunMadeBeforeAtReplicateZero"
  [[mutant.edit]]
  from = '''NOT NULL DEFAULT 0 CHECK'''
  to = '''NOT NULL DEFAULT 1 CHECK'''
