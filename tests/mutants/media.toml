# Mutants of rr_media: each removes one rule of reading yt-dlp's description,
# choosing captions, or running yt-dlp, and names the test that must fail
# without it. Run: scripts/mutate.py tests/mutants/media.toml
# What they found is in docs/design/transcript.md, "How the tests were validated".

target = "rr_media_tests"
binary = "build/dev/tests/unit/media/rr_media_tests"
timeout = 90

# --- The video (video.cpp) ------------------------------------------------------

[[mutant]]
name = "anything-is-a-video"
file = "src/media/video.cpp"
expect = "Video.IsOneVideoWithAnId"
  [[mutant.edit]]
  from = '''    if (!info.is_object()) {'''
  to = '''    if (false) {'''

[[mutant]]
name = "a-playlist-is-a-video"
file = "src/media/video.cpp"
expect = "Video.IsOneVideoWithAnId"
  [[mutant.edit]]
  from = '''        type.has_value() && *type != "video") {'''
  to = '''        type.has_value() && *type == "never") {'''

[[mutant]]
name = "a-chapter-ending-before-it-starts-kept"
