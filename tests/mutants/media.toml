  from = '''    {.says = "http error 5", .code = Errc::unavailable, .meaning = "YouTube is failing for now"},'''
  to = '''    {.says = "http error 5 never", .code = Errc::unavailable, .meaning = "YouTube is failing for now"},'''

[[mutant]]
name = "the-last-error-unquoted"
