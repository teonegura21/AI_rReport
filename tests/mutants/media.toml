  to = '''    } else if (std::ranges::count(video.captions, CaptionKind::manual, &CaptionOffer::kind) >= 1) {'''

[[mutant]]
name = "an-unreadable-track-chosen"
file = "src/media/video.cpp"
expect = "CaptionChoice.Json3IsReadFirstThenWebVttThenSubRip"
  [[mutant.edit]]
