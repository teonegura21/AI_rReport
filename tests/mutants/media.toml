}

// "en (the creator's), en-orig (automatic)": what is on offer, for a message.'''
  to = '''    return CaptionFormat::json3;
}

// "en (the creator's), en-orig (automatic)": what is on offer, for a message.'''

[[mutant]]
name = "webvtt-before-json3"
file = "src/media/video.cpp"
expect = "CaptionChoice.TheCreatorsCaptionsInTheLanguageSpokenComeFirst"
  [[mutant.edit]]
  from = '''    for (const CaptionFormat format : {CaptionFormat::json3, CaptionFormat::vtt, CaptionFormat::srt}) {'''
  to = '''    for (const CaptionFormat format : {CaptionFormat::vtt, CaptionFormat::json3, CaptionFormat::srt}) {'''

# --- Running yt-dlp (ytdlp.cpp) -------------------------------------------------

[[mutant]]
name = "an-address-without-its-separator"
file = "src/media/ytdlp.cpp"
expect = "YtDlp.DescribesTheVideo"
  [[mutant.edit]]
  from = '''    command.argv.emplace_back("--");'''
  to = '''    (void)0;'''

[[mutant]]
