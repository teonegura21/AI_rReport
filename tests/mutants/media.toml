# --- Which captions (video.cpp) -------------------------------------------------

[[mutant]]
name = "the-recognized-language-unheard"
file = "src/media/video.cpp"
expect = "CaptionChoice.TheLanguageSpokenIsTheOneRecognized"
  [[mutant.edit]]
  from = '''    if (!spoken.has_value() && recognized != video.captions.end()) {'''
  to = '''    if (false) {'''

[[mutant]]
name = "the-very-language-not-first"
file = "src/media/video.cpp"
expect = "CaptionChoice.ARegionalVariantIsTheLanguageToo"
  [[mutant.edit]]
  from = '''        add([&](const CaptionOffer& offer) { return manual(offer) && offer.language == *spoken; });'''
  to = '''        add([&](const CaptionOffer& offer) { return manual(offer) && offer.language == "never"; });'''

[[mutant]]
name = "a-translation-chosen"
file = "src/media/video.cpp"
expect = "CaptionChoice.NeverATranslation"
  [[mutant.edit]]
  from = '''            return manual(offer) && primary(offer.language) == primary(*spoken);'''
  to = '''            return manual(offer);'''

[[mutant]]
