  [[mutant.edit]]
  from = '''    if (url.starts_with("https://") || url.starts_with("http://")) {'''
  to = '''    if (true) {'''

[[mutant]]
name = "the-creators-for-automatic"
file = "src/media/ytdlp.cpp"
expect = "YtDlp.DownloadsTheCaptionsChosen"
  [[mutant.edit]]
  from = '''choice.kind == CaptionKind::manual ? "--write-subs" : "--write-auto-subs"'''
  to = '''choice.kind == CaptionKind::manual ? "--write-auto-subs" : "--write-subs"'''

[[mutant]]
name = "an-earlier-tries-captions-read"
file = "src/media/ytdlp.cpp"
expect = "YtDlp.CaptionsNeverWrittenAreNotFound"
  [[mutant.edit]]
  from = '''    std::filesystem::remove(file, error);'''
  to = '''    (void)file;'''

[[mutant]]
name = "a-bot-check-unrecognized"
file = "src/media/ytdlp.cpp"
expect = "YtDlp.FailuresAreToldInRReportsTerms"
  [[mutant.edit]]
