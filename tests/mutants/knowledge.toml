# Mutants of rr_knowledge: the short IDs, the artifacts' own rules, and the marker parser
# (ADR-0006). Each removes one rule and names the test that must fail without it.
# Run: scripts/mutate.py tests/mutants/knowledge.toml
# What they found is in docs/design/knowledge.md, "How the tests were validated".

target = "rr_knowledge_tests"
binary = "build/dev/tests/unit/knowledge/rr_knowledge_tests"
timeout = 60

[[mutant]]
name = "ids-with-leading-zeros"
file = "src/knowledge/include/rr/knowledge/ids.hpp"
