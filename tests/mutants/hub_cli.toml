# Mutants of the hub's eval commands that only the real executable shows
# (P25): each removes one rule of `rreport eval gate` and names the CLI test
# that must fail without it. The test's target builds rreport first, so a
# mutant in apps/ reaches the binary it runs.
# Run: scripts/mutate.py tests/mutants/hub_cli.toml
# What they found is in docs/design/eval.md, "How the tests were validated".

target = "rr_hub_cli_tests"
binary = "build/dev/tests/component/rr_hub_cli_tests"
timeout = 300

[[mutant]]
name = "an-aa-run-is-not-checked"
file = "apps/rreport/eval_commands.cpp"
expect = "Hub.TwoRunsAreComparedAndTheGateDecidesOnlyWhatItsNumbersCanSay"
  [[mutant.edit]]
  from = '''        if (auto again = eval::check_aa(pair->a, pair->b); !again.has_value()) {'''
  to = '''        if (auto again = eval::check_aa(pair->a, pair->a); !again.has_value()) {'''

[[mutant]]
name = "a-failed-gate-exits-0"
file = "apps/rreport/eval_commands.cpp"
expect = "Hub.TwoRunsAreComparedAndTheGateDecidesOnlyWhatItsNumbersCanSay"
  [[mutant.edit]]
  from = '''    return reading.passed() ? kOk : kFailure;'''
  to = '''    return kOk;'''

[[mutant]]
name = "flow-is-shown-unread"
file = "apps/rreport/eval_commands.cpp"
expect = "Hub.TwoRunsAreComparedAndTheGateDecidesOnlyWhatItsNumbersCanSay"
  [[mutant.edit]]
  from = '''    if (one != nullptr && one->pairwise && !flags.flow) {'''
  to = '''    if (false && one != nullptr && one->pairwise && !flags.flow) {'''

[[mutant]]
name = "a-stale-panel-reads-the-pairs"
file = "apps/rreport/eval_commands.cpp"
expect = "Hub.TwoRunsAreComparedAndTheGateDecidesOnlyWhatItsNumbersCanSay"
  [[mutant.edit]]
  from = '''        return FlowRow{.code = failed(kFailure, prompts.error())};
    }
    if (auto frozen = eval::check_panel(*panel, *prompts); !frozen.has_value()) {'''
  to = '''        return FlowRow{.code = failed(kFailure, prompts.error())};
    }
    if (auto frozen = eval::check_panel(*panel, *prompts); false && !frozen.has_value()) {'''

[[mutant]]
name = "what-the-flow-could-not-read-is-not-said"
file = "apps/rreport/eval_commands.cpp"
expect = "Hub.TwoRunsAreComparedAndTheGateDecidesOnlyWhatItsNumbersCanSay"
  [[mutant.edit]]
  from = '''            text += std::format("  {}\n", note);'''
  to = '''            (void)note;'''

[[mutant]]
name = "a-pairing-is-resumed"
file = "apps/rreport/main.cpp"
expect = "Hub.APairingIsTakenUpByEvalCompareAndHasNoPageOfItsOwn"
  [[mutant.edit]]
  from = '''        case library::JobKind::pairing:
            return failed('''
  to = '''        case library::JobKind::pairing:
            break;
            return failed('''

# P26: the eval's page and an ingest's tier, as the real executable reads them.

[[mutant]]
name = "the-page-is-written-elsewhere"
file = "apps/rreport/eval_commands.cpp"
expect = "Hub.ASweepAPageOrATierAskedWronglyIsRefusedSayingWhy"
  [[mutant.edit]]
  from = '''flags.out.value_or(flags.root / "report.html");'''
  to = '''flags.out.value_or(flags.root / "runs.html");'''

[[mutant]]
name = "a-page-plots-a-pairwise-metric"
file = "apps/rreport/eval_commands.cpp"
expect = "Hub.ASweepAPageOrATierAskedWronglyIsRefusedSayingWhy"
  [[mutant.edit]]
  from = '''        if (metric == nullptr || metric->pairwise) {'''
  to = '''        if (metric == nullptr) {'''

[[mutant]]
name = "an-ingests-tier-is-a-shipped-one"
file = "apps/rreport/main.cpp"
expect = "Hub.ASweepAPageOrATierAskedWronglyIsRefusedSayingWhy"
  [[mutant.edit]]
  from = '''    if (auto tier = reason::find_tier(flags.tier); !tier.has_value()) {'''
  to = '''    if (auto tier = reason::builtin_tier(flags.tier); !tier.has_value()) {'''
