# Continuous integration: every push and pull request must pass the same gates
# a developer runs locally (see README "Building").
#
#   format      clang-format has nothing to change
#   build-test  GCC debug; Clang + ASan/UBSan; Clang + TSan — all tests green
#   tidy        clang-tidy with warnings as errors on every rReport translation unit
#   fetch       dependencies built from pinned git tags only (proves ADR-0012's fallback)
#   scripts     the pod image's entry point (shellcheck, and its tests with fake
#               tools) and scripts/ (their tests, against a fake Hugging Face Hub)
name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 20
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-20
      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format-20 --dry-run --Werror

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, dev-clang, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo scripts/install-deps-ubuntu.sh --with-clang
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/RrDependencies.cmake') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo scripts/install-deps-ubuntu.sh --with-clang
      - name: Configure
        run: cmake --preset tidy
      - name: Build with clang-tidy
        run: cmake --build --preset tidy

  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system-only dependencies
        run: sudo scripts/install-deps-ubuntu.sh --minimal
      - name: Configure (ignore system packages)
        run: cmake --preset ci-fetch
      - name: Build
        run: cmake --build --preset ci-fetch
      - name: Test
        run: ctest --preset ci-fetch

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint the entry point
        run: shellcheck --severity=style docker/runtime/entrypoint.sh
      - name: Test the entry point
        run: python3 -m unittest discover -s docker/runtime -p 'test_*.py' -v
      - name: Test the scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
