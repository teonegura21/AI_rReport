# rreport (the hub) — built-in defaults. Compiled into the binary.
#
# These defaults are also the schema: every settable key appears here with its
# type, so a misspelt key or a wrong type fails at startup, with a suggestion,
# instead of being ignored. Layers, each overriding the ones before:
#
#   these defaults
#   < the config file          --config PATH, or RREPORT_CONFIG, or
#                              ~/.config/rreport/config.toml when it exists
#   < the secrets file         --secrets PATH, or ~/.config/rreport/secrets.toml
#                              when it exists (must be chmod 600)
#   < environment variables    RREPORT_<SECTION>__<KEY>, e.g. RREPORT_RUNPOD__POD_ID=abc123
#   < --set section.key=value
#
# `rreport config show --origin` prints every value and where it came from.
# Durations are written with a unit: "250ms", "30s", "15m", "24h".

[hub]
data_dir = ""                # empty: $XDG_DATA_HOME/rreport, or ~/.local/share/rreport
library = "default"          # the library commands work in

[runtime]
url = ""                     # empty: RunPod's proxy URL for runpod.pod_id and runpod.port
token = ""                   # the runtime's bearer token (its RR_RUNTIME_TOKEN)
ready_timeout = "20m"        # how long a starting pod may take to load its models

[runpod]
api_key = ""                 # RunPod API key, for starting and stopping the pod
pod_id = ""
port = 8080                  # the runtime's port, exposed over HTTP by the pod's template
api_url = "https://api.runpod.io/v2"   # RunPod REST API v2

[media]
ytdlp = "yt-dlp"             # yt-dlp: a name found in PATH, or a path. You install and update it (rreport doctor)
ytdlp_timeout = "3m"         # the most one run of it may take: a description, or a video's captions

[llm]
mode = "live"                # live · record (live, and keep every answer) · replay (recorded answers only)
recordings = ""              # where record and replay keep answers; empty: <data_dir>/recordings
idle_timeout = "60s"         # a streamed call silent this long has failed (the runtime pings every 15s)
call_timeout = "30m"         # no single call may take longer
attempts = 4                 # tries per call, when the failures are transient

# How each model samples. Missions apply one of these presets, so no call
# depends on the server's defaults (docs/design/llm.md, "Sampling"). Values
# are the model cards'; the eval's sweeps tune them (runbook R6).
#   Penalties stay neutral (presence 0, repeat 1) on purpose: they bias a
#   structured answer's labels and paraphrase quotes.
#   thinking_budget: tokens of thought before the server makes the model
#   answer, saying thinking_closing first (-1: no budget).
#   reasoning_effort: low, medium, high or xhigh ("": the model's own).
[sampling.qwen_thinking]     # Qwen3.8, the commander, thinking: planning, judging
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
thinking = true
thinking_budget = 8192
thinking_closing = "\n\nI have thought enough, and must answer now from what I have so far.\n"
reasoning_effort = "medium"  # the template's default, xhigh, over-thinks

[sampling.qwen_direct]       # Qwen3.8 without thinking: drafting
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 0.0       # the card says 1.5, against loops: see above
repeat_penalty = 1.0
thinking = false
thinking_budget = -1
thinking_closing = ""
reasoning_effort = ""

[sampling.gemma_thinking]    # Gemma 4, the infantry, thinking: escalations, judging
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
thinking = true
thinking_budget = 4096       # Gemma 4 can loop while thinking
thinking_closing = "\n\nI have thought enough, and must answer now from what I have so far.\n"
reasoning_effort = ""

[sampling.gemma_direct]      # Gemma 4 without thinking: labelling, extraction
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0
thinking = false
thinking_budget = -1
thinking_closing = ""
reasoning_effort = ""

[log]
level = "info"               # trace, debug, info, warn, error
file = ""                    # JSON Lines, rotated; empty: the console only
