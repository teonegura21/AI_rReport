# The `fast` tier: one sample everywhere, with validators and a repair
# (ADR-0018). For development, and the cheap end of the eval's quality-cost
# chart. Every stage runs the same code as at `max`, with one sample. Keys:
# see max.toml.

[outline]
chapters = true
samples = 1
boundary_tolerance = 2
quorum = 0.5
thinking_budget = 8192

[atomize]
first = 1
step = 0
max = 1
quorum = 0.5
sure = 0.0
thinking = false
repairs = 1
recall_pass = false
contested_to_commander = false

[plan]
mode = "group"            # deterministic grouping: no model
thinking_budget = 8192

[write]
drafts = 1
fuse = false              # one draft: nothing to fuse
thinking = false
judge_top = 0             # one draft: nothing to compare
repair_rounds = 1

[seams]
mode = "none"
