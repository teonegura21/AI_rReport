# ── Profiles ─────────────────────────────────────────────────────────────────

# 16 GB (RTX A4000, and 22–23 GB cards such as the L4 and A10): no commander
# fits. Light infantry and the embedder: a cheap pod to smoke-test the image.
[[profile]]
name = "16gb"
min_vram_mib = 15000
  [[profile.engine]]
  model = "gemma-4-e4b"
  slots = 8
  context = 32768  # 4096 per slot: a mission is a transcript chunk and its instructions
  extra_args = ["--n-gpu-layers", "999", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--jinja"]
  [[profile.engine]]
  model = "qwen3-embedding-0.6b"
  slots = 4
  context = 8192
  extra_args = ["--n-gpu-layers", "999", "--pooling", "last", "--batch-size", "2048", "--ubatch-size", "2048"]

# 24 GB (RTX 4090, RTX 3090, RTX A5000): the commander alone, ~17–19 + 0.7 GB
# (projector) + ~1 GB of cache + buffers. Commander and infantry phases
# alternate on this size (plan §4.5); "auto" picks this profile.
[[profile]]
name = "24gb"
min_vram_mib = 24000
  [[profile.engine]]
  model = "qwen3.8-27b-q4"
  slots = 1
  context = 16384
  extra_args = ["--n-gpu-layers", "999", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0", "--jinja"]

