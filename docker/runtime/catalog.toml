# The pod's model catalog: which model files exist, and which run together on
# a GPU of each size. The image installs it as /opt/rreport/catalog.toml, the
# runtime's `models.catalog` default. Format and rules: rr/supervisor/catalog.hpp.
#
# ── Checksums ────────────────────────────────────────────────────────────────
# Every file is verified against its sha256 before an engine may load it, and
# `rreport-runtime models sync` publishes a download only when it matches.
#
#   NOT YET VERIFIED AGAINST THE HUB. The values below come from LocalAI's
#   model gallery (a third party), read on 2026-09-30. The Qwen3.8 files were
#   re-uploaded on 2026-09-20; the gallery updated its checksums that day.
#   Before the first sync, on a machine that can reach huggingface.co:
#
#     scripts/model-hashes.py check docker/runtime/catalog.toml   # compare
#     scripts/model-hashes.py pin docker/runtime/catalog.toml     # pin commits
#
#   `pin` replaces "resolve/main" in each URL with the commit it resolves to
#   now, and each checksum with the Hub's own record, so a later re-upload
#   can never change what a pod downloads.
#
# ── Profiles ─────────────────────────────────────────────────────────────────
# `models.profile = "auto"` runs the profile with the largest min_vram_mib that
# the smallest GPU holds (the first listed wins a tie). The sizes follow the
# plan's §4.5; the M0 benchmark (`rreport bench`) replaces the estimates with
# measurements, and may raise the contexts and slot counts.
#
# The memory arithmetic, per engine: weights + vision projector + attention
# cache (8-bit K and V: --cache-type-k/v q8_0, which needs --flash-attn) +
# compute buffers (~1–2 GB) + a CUDA context (~0.4 GB).
#
# Every engine gets:
#   --n-gpu-layers 999   every layer on the GPU. A model that does not fit
#                        fails to load, loudly, instead of running partly on
#                        the CPU (which would also make the benchmark lie).
#   --flash-attn on      required by the quantized V cache
#   --cache-type-k/v q8_0  half the attention cache of f16, at a negligible
#                        quality cost
#   --jinja              the model's own chat template: thinking on and off
#                        (chat_template_kwargs.enable_thinking) needs it
# The supervisor adds --model, --alias, --host 127.0.0.1, --port, --parallel,
# --ctx-size, and --mmproj / --embedding where the catalog says so.

