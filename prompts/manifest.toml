# The prompts: one [[prompt]] each. rr/prompt/library.hpp explains the rules;
# docs/design/prompts.md, the craft.
#
#   [[prompt]]
#   name = "atomize"            # its files: prompts/atomize/system.md.inja,
#                               # task.md.inja and example.json
#   purpose = "…"               # one line
#   schema = "schemas/missions/atomize.json"  # its answer's schema, if any
#   shared = ["role", "rules", "brief"]       # all its system part may use
#   failure_modes = ["…"]       # how it is known to go wrong
#     [[prompt.version]]        # one per change, oldest first
#     number = 1
#     hash = "…"                # the files' content hash at this version;
#                               # the L0 check prints the next one to add
#     note = "first version"
#
# The prompts arrive with their stages: punctuate with the transcript (plan
# P15); annotate and annotate_more with the eval's silver drafts (P16);
# outline, describe and brief with the outline (P17); atomize with Ledger
# A (P18); plan with the plan (P19); write with the article (P20); judge and
# flow with the drafts' judging (P20b).

[[prompt]]
name = "punctuate"
purpose = "Put back the punctuation and capitals of a window of automatic captions, keeping every word: the transcript stage lays them onto the captions' words (rr/pipeline/punctuation.hpp)."
schema = "schemas/missions/punctuate.json"
shared = ["title", "channel", "description"]
failure_modes = [
  "rewrites words: numbers into digits (\"thirty seven\" into \"37\"), contractions (\"were\" into \"we're\"), fillers and repetitions dropped",
  "ends the excerpt with a full stop although its last sentence runs on: harmless, since the context after a window is not kept",
  "capitalizes common nouns as if they were names",
]
  [[prompt.version]]
  number = 1
  hash = "b0d3c51c1d85cc936efac563ac75104ea7f0ec4399cc139685c9a6bf4bd2ad91"
  note = "first version"

[[prompt]]
name = "annotate"
purpose = "Write down what a window of a transcript says that a complete account must keep (facts, must-quotes, terms), each resting on cited sentences and their exact words: the eval's silver draft (rr/eval/annotate.hpp)."
schema = "schemas/missions/annotate.json"
shared = ["title", "channel"]
failure_modes = [
  "quotes in its own words instead of the sentences': the check sends it back",
  "cites a sentence of the context, outside the window",
  "adds what it knows of the subject instead of what was said",
  "one fact per sentence, where a sentence says two things",
]
  [[prompt.version]]
  number = 1
  hash = "86a1db526891aecb2ed05c3e69d0f3928968739e4a903a211c72e6b050705e8d"
  note = "first version"

[[prompt]]
name = "annotate_more"
purpose = "Add what another family's notes on a window missed: the second reader of the eval's silver draft (rr/eval/annotate.hpp)."
schema = "schemas/missions/annotate.json"
shared = ["title", "channel"]
failure_modes = [
  "repeats the notes in other words instead of adding",
  "adds facts the sentences do not say, to have something to add",
]
  [[prompt.version]]
  number = 1
  hash = "d37b22e6e28cc5d84b918e0d7fe954eba807ad86faea8fed571080cbc048986f"
  note = "first version"

[[prompt]]
name = "outline"
purpose = "Cut a stretch of a transcript into sections, each a stretch of talk about one thing, and title them: where the article's parts begin (rr/pipeline/outline_stage.hpp)."
schema = "schemas/missions/outline.json"
shared = ["title", "channel", "description"]
failure_modes = [
  "a section at every pause, or every few sentences: the check sends back more than a section a minute",
  "a section that starts among the context sentences, outside the stretch to outline",
  "a section inside a story or an example, splitting it from its point",
  "titles that summarize instead of naming, longer than twelve words",
]
  [[prompt.version]]
  number = 1
  hash = "5d91e8cc0e63ab3bf357c282b55c0a707eb00a64a643c2022b2aa7ea243bdea4"
  note = "first version"

[[prompt]]
name = "describe"
purpose = "Say who speaks in a section of a transcript, the words it uses for things, and what it says: the section's gist, and its share of the video's brief (rr/pipeline/outline_stage.hpp)."
schema = "schemas/missions/describe.json"
shared = ["title", "channel", "description"]
failure_modes = [
  "names a speaker the video never names, or lists a person who is only talked about",
  "lists words the section does not say, or common words no reader stumbles on",
  "a gist of the subject, from what the model knows, instead of what the section says",
]
  [[prompt.version]]
  number = 1
  hash = "78334d916140796966e32b6909ed4a45d2a9b7ba569edd551d5a80412f4b1142"
  note = "first version"

[[prompt]]
name = "brief"
purpose = "Write the gist of a whole video from the gists of its sections, in their order: the paragraph every later mission is given (rr/pipeline/outline_stage.hpp)."
schema = "schemas/missions/brief.json"
shared = ["title", "channel", "description"]
failure_modes = [
  "judges the video instead of saying what it says",
  "adds what the model knows of the subject",
  "lists the sections one by one instead of telling how the video goes",
]
  [[prompt.version]]
  number = 1
  hash = "12dbc256b3b0fadd4c3b49a36dc821252c51c46b9268508e786ae2a349d4f14f"
  note = "first version"

[[prompt]]
name = "atomize"
purpose = "Write down what each sentence of a window says, as atoms, or why it holds none (a filler label): Ledger A, every sentence accounted for (rr/pipeline/atomize_stage.hpp). Three modes share its rules: read a window; settle the sentences other readers disagreed on; recall what a sentence's atoms miss."
schema = "schemas/missions/atomize.json"
shared = ["title", "channel", "gist", "speakers", "lexicon"]
failure_modes = [
  "a sentence skipped, or written twice: the check sends it back",
  "a number its sentence does not say, or a must-quote in its own words",
  "a sentence with a number, a name or one of the video's words labelled filler",
  "an atom that says more than its sentence: what the model knows of the subject",
  "a hedge read as a plain statement, a joke or an aside as the main point",
  "in recall, the atoms it already has written again",
]
  [[prompt.version]]
  number = 1
  hash = "255fa73307c738df3a32be35757c5bb6faf8d6acee9ff3f4d095e5152aeead54"
  note = "first version"

[[prompt]]
name = "plan"
purpose = "Plan how one section is retold: its paragraphs in the order told, the atoms each tells, the atoms that only say again what another says, and its heading; every atom placed, a closed world (rr/pipeline/plan_stage.hpp)."
schema = "schemas/missions/plan.json"
shared = ["title", "channel", "gist", "sections"]
failure_modes = [
  "an atom left out, told twice, or one of another section named: the check sends it back",
  "a duplicate that adds something, a number, a name, a hedge, another speaker: the check sends it back",
  "the talk reordered for a tidier story: only a warning on the article",
  "paragraphs of one atom each, or one paragraph of the whole section",
  "a heading that judges the section instead of naming it",
]
  [[prompt.version]]
  number = 1
  hash = "003821ecab151466458d3c2a134ba9d23b4fbfe521070ff3adb9ae1bb4bcfe2f"
  note = "first version"

[[prompt]]
name = "write"
purpose = "Write one section of the article from its plan: each paragraph telling its atoms, every sentence ending with their markers, every number, name, term and word to quote kept, said as it was said (rr/pipeline/write_stage.hpp)."
shared = ["title", "channel", "gist", "speakers", "lexicon", "sections"]
failure_modes = [
  "an atom left out, or told in another paragraph: the check sends it back",
  "a sentence with no marker, often a link between two that adds what was not said",
  "a hedge told as a fact, a strong claim softened, a joke told straight",
  "a number rounded, a name or a term reworded, a quote paraphrased",
  "what the model knows of the subject, added to explain",
]
  [[prompt.version]]
  number = 1
  hash = "d405e5064b4917e7641c8b35b664ed8326fb90c77c0577d9fa380d150aaab599"
  note = "first version"

[[prompt]]
name = "judge"
purpose = "Read each sentence of a draft against the atoms it cites, the evidence quoted before a verdict: whether it says only what they say, or adds, softens, intensifies, misattributes or contradicts; asked of another family than the writer's (rr/pipeline/judging.hpp)."
schema = "schemas/missions/judge.json"
shared = ["title", "channel"]
failure_modes = [
  "a verdict without evidence, or evidence the atoms do not hold",
  "plain words for an atom's read as an issue: rewording is no issue",
  "a sentence skipped, or judged twice",
  "the judge's own knowledge of the subject taken as evidence",
]
  [[prompt.version]]
  number = 1
  hash = "dc2fb8ed580d9ca6021b3abc9e66c02624e48a45f9c532e0f6769dccf0e24db4"
  note = "first version"
  [[prompt.version]]
  number = 2
  hash = "e2819bd8be8b30c058f9696ccdb87277ca25cc8a2db35b48fafb53135d59d31e"
  note = "the task names what it checks, a section or a seam, for the seams stage (P20c)"

[[prompt]]
name = "flow"
purpose = "Say which of two drafts of a section reads better, its reasons first; asked in both orders, a preference that flips being a tie (rr/reason/pairwise.hpp)."
schema = "schemas/missions/flow.json"
shared = ["title", "channel"]
failure_modes = [
  "the draft shown first preferred whatever it says: asked swapped, it ties",
  "the longer draft preferred for being longer",
  "a preference for what is said, which both drafts share, not for how",
]
  [[prompt.version]]
  number = 1
  hash = "1f7de5948fdfb2aa6cb8c9d016eb73206feac42db56058ddc0c2386e8a3a3659"
  note = "first version"

[[prompt]]
name = "seam"
purpose = "Rewrite the two paragraphs where two sections of the article meet, so that the article reads on: each paragraph keeping its atoms and markers, only how things are said changed (rr/pipeline/seams_stage.hpp)."
shared = ["title", "channel"]
failure_modes = [
  "an atom moved to the other paragraph, or dropped: the check sends it back",
  "a link that adds what was not said, a cause or a contrast no atom gives",
  "a hedge firmed up, or a statement given to another, while rewording",
  "the paragraphs' far ends rewritten too, opening a new seam within a section",
]
  [[prompt.version]]
  number = 1
  hash = "fc92f6ec48ab7137591a8304502498806eaf8b6f1592a712978ba79479a28160"
  note = "first version"
