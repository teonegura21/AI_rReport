# ---------------------------------------------------------------------------
# Considered and excluded
# ---------------------------------------------------------------------------
#   DARPA "Voices from DARPA" podcast: permission comes with conditions
#     (attribution, no implied endorsement): not a clean public-domain grant.
#   Census Bureau videos: their policy says they are not licensed for
#     commercial use.
#   National Cancer Institute (NIH) channel: "copyright remains with the
#     National Cancer Institute".
#   Library of Congress events: the rights assessment is left to the user,
#     and many speakers are outside guests.
#   NASA JPL and contractor-run national labs: their staff are not federal
#     employees.
#   freeCodeCamp's main channel: freeCodeCamp says it owns those videos.
#   TED, TEDx, MIT OpenCourseWare, Khan Academy: NC or ND licences.
#   Over 60 minutes, kept in reserve: NASA "Cosmic Dawn" (uSMGENDH_QI, 96 min)
#     and NASA "Planetary Defenders" (75 min; id not found).
