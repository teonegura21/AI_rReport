# rReport's evaluation candidates: PROPOSED, not yet approved.
#
# What this file is
#   The videos proposed for the eval set (ADR-0019). There are four types:
#   talk, conversation, tutorial (visual) and narrative. The owner approves,
#   swaps or strikes each one. Approved videos move to a set file
#   (eval/sets/m2.toml) with a dev/test split, and `rreport eval fetch`
#   (plan P16) snapshots their captions and metadata, pinned by hash.
#
# Licences
#   ADR-0019 allows only CC BY or the US public domain. Every candidate below
#   is a work of the US federal government: 17 U.S.C. §105 puts it in the US
#   public domain. [licence.*] quotes each agency's own statement.
#   - No CC BY candidate could be confirmed. YouTube shows that licence line
#     only on the watch page, which this environment cannot reach.
#   - A speaker who is not a federal employee (a guest panelist, a reporter)
#     may hold rights in their own words. Those videos say
#     all_speakers_federal = false; prefer the others for stored snapshots.
#
# What was checked, and what was not
#   Every fact comes from search-engine text about official pages
#   (checked = "search"). Nobody has opened the watch pages: youtube.com and
#   the agency sites are blocked here. Before approving a video, check on its
#   page:
#     1. the uploader is the agency's own channel;
#     2. the duration;
#     3. the caption tracks:
#          yt-dlp --skip-download --list-subs https://www.youtube.com/watch?v=<id>
#        lists manual tracks under "Available subtitles" and machine ones
#        under "Available automatic captions".
#
# Fields
#   id                    YouTube video id (watch?v=<id>), or none yet
#   type                  talk | conversation | tutorial | narrative
#   title, agency
#   published             "YYYY-MM-DD", or "YYYY-MM" / "YYYY" when only that was stated
#   duration_min          minutes, when stated
#   speakers              as found; "+ press" etc. marks non-federal voices
#   all_speakers_federal  whether every voice is a federal employee
#   captions              manual | auto | unknown (unknown for all, today)
#   why                   what it tests
#   risks                 what could disqualify it
#   pick                  recommended for the first set
#   m1                    proposed as an M1 acceptance video:
#                         talk-20 · lecture-60 (auto captions) · interview-90
#   checked               "search": facts from search text only

status = "proposed"
checked_on = "2026-10-01"

[licence.nasa]
basis = 'NASA content "generally [is] not subject to copyright in the United States" (nasa.gov/nasa-brand-center/images-and-media)'
[licence.usgs]
basis = '''USGS material is "considered to be in the U.S. public domain" (usgs.gov/copyright). The same page warns that a staff member's likeness or voice may carry publicity rights: relevant to showing media, not to quoting text.'''
[licence.fda]
basis = 'FDA website contents are "not copyrighted ... in the public domain" (fda.gov/about-fda/about-website/website-policies)'
[licence.federal-reserve]
basis = '''"Information on the Board's website is in the public domain" (federalreserve.gov/disclaimer.htm)'''
[licence.army-university-press]
basis = '"Pursuant to Title 17 Section 105 ... films are ... in the public domain" (Army University Press)'
[licence.csb]
basis = '''The Chemical Safety Board's site holds "public information that may be distributed or copied unless otherwise specified" (csb.gov/privacy-policy)'''
[licence.nlm]
basis = '"Government information at NLM Web sites is in the public domain" (NLM/NCBI)'
[licence.copyright-office]
basis = 'No site statement found. 17 U.S.C. §105, as the speakers are Copyright Office officials (an inference).'

