# The eval's judges, frozen (rr/eval/panel.hpp, docs/design/eval.md "The
# judges"). Every score they give is kept as "judges@eval-v1", and is never
# compared with another panel's. Do not edit what this file pins: a change to
# a prompt, a model or the judging procedure makes a new panel, eval-v2, in a
# file of its own. Only `calibrated` changes here, once a person's labels
# have shown that the panel reads as they do (plan P27): until then its
# scores are reported, and the gate ignores them.

name = "eval-v1"
procedure = 1
calibrated = false

# The prompts, by version and hash as prompts/manifest.toml has them.
[[prompt]]
name = "eval_fact"
version = 1
hash = "ef66ea0578b0abca1bbd4222f2f59e61ce91b588ce616e691d1e4e16a35713bc"

[[prompt]]
name = "eval_support"
